# vu-movie — docker-compose for Synology DS918+ (DSM 7 Container Manager)
# =============================================================================
# Quick start
#   1. put this folder somewhere on the NAS (e.g. /volume1/docker/vu-movie)
#   2. edit .env (copy .env.example) — at minimum set ENIGMA2_HOST
#   3. Container Manager → Project → Create → select this folder → Build
#      (or from a shell:  docker compose up -d --build)
#
# Hardware transcoding requires the /dev/dri device to be passed through; on DSM
# that is the `devices:` line below plus the Intel GPU driver being loaded on the
# host (it is, on a DS918+ — check with:  ls -l /dev/dri)
# =============================================================================
name: vu-movie

services:
  # ---------------------------------------------------------------- vu-movie app
  vu-movie:
    build:
      context: .
      dockerfile: Dockerfile
    image: vu-movie:1.0.0
    container_name: vu-movie
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      # --- database: lazy pool, migrations run automatically at startup ---
      DATABASE_URL: postgres://${POSTGRES_USER:-vu-movie}:${POSTGRES_PASSWORD:-vumovie}@db:5432/${POSTGRES_DB:-vumovie}
      # Set to true to make the container refuse to start when Postgres is down
      # (default false: it degrades to an in-memory store and keeps streaming).
      REQUIRE_DB: "${REQUIRE_DB:-false}"
      # Warn when a single query exceeds this (ms). The first reads after a start
      # come off cold disks/cache and can cross it once; that is I/O, not a
      # database problem, so the bar is deliberately above a warm cache miss.
      DB_SLOW_QUERY_MS: "${DB_SLOW_QUERY_MS:-1500}"
      TZ: "${TZ:-Europe/Amsterdam}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      # LAN URL handed to VLC / the Duo2. Leave empty to auto-detect from the
      # request (works when you open the UI via the NAS IP).
      BASE_URL: "${BASE_URL:-}"
      # --- transcoding (DS918+ / HD Graphics 500) ---
      TRANSCODE_MODE: "${TRANSCODE_MODE:-auto}"          # auto|copy|vaapi|x264|h265
      ALWAYS_TRANSCODE: "${ALWAYS_TRANSCODE:-false}"
      MAX_CONCURRENT_TRANSCODES: "${MAX_CONCURRENT_TRANSCODES:-1}"
      HWACCEL: "${HWACCEL:-true}"
      VAAPI_DEVICE: "${VAAPI_DEVICE:-/dev/dri/renderD128}"
      DEFAULT_RESOLUTION: "${DEFAULT_RESOLUTION:-1080}"
      DEFAULT_VIDEO_BITRATE: "${DEFAULT_VIDEO_BITRATE:-8000}"
      DEFAULT_AUDIO_BITRATE: "${DEFAULT_AUDIO_BITRATE:-192}"
      DEFAULT_AUDIO_CHANNELS: "${DEFAULT_AUDIO_CHANNELS:-6}"
      DEFAULT_FPS: "${DEFAULT_FPS:-25}"
      DEFAULT_CONTAINER: "${DEFAULT_CONTAINER:-mpegts}"  # mpegts|matroska|hls
      # Empty = auto-detect: the app tries iHD and then i965 and passes the
      # driver that really encoded the test pattern to ffmpeg. On a DS918+
      # (Apollo Lake) that is usually i965 even though iHD installs fine, so
      # hard-coding iHD is what silently disables hardware transcoding.
      LIBVA_DRIVER_NAME: "${LIBVA_DRIVER_NAME:-}"
      # How long `ffmpeg -version` may take before it counts as failed. A
      # timeout is NOT "ffmpeg missing" (that bug disabled all transcoding and
      # was then cached for a week) — failures are retried in the background.
      FFMPEG_PROBE_TIMEOUT_MS: "${FFMPEG_PROBE_TIMEOUT_MS:-30000}"
      FFMPEG_RECHECK_MS: "${FFMPEG_RECHECK_MS:-60000}"
      # --- VU+ Duo2 ---
      ENIGMA2_HOST: "${ENIGMA2_HOST:-}"
      ENIGMA2_PORT: "${ENIGMA2_PORT:-80}"
      ENIGMA2_USER: "${ENIGMA2_USER:-root}"
      ENIGMA2_PASSWORD: "${ENIGMA2_PASSWORD:-}"
      ENIGMA2_BOUQUET: "${ENIGMA2_BOUQUET:-vu-movie}"
      ENIGMA2_SERVICE_TYPE: "${ENIGMA2_SERVICE_TYPE:-4097}"
      ENIGMA2_FTP: "${ENIGMA2_FTP:-true}"
      # --- subtitles ---
      SUBTITLE_LANGUAGES: "${SUBTITLE_LANGUAGES:-nl,en}"
      SUBTITLE_PUSH: "${SUBTITLE_PUSH:-false}"
      OPENSUBTITLES_API_KEY: "${OPENSUBTITLES_API_KEY:-}"
      SUBDL_API_KEY: "${SUBDL_API_KEY:-}"
      # --- scraping (raise these only on a stronger NAS) ---
      BROWSER_CONCURRENCY: "${BROWSER_CONCURRENCY:-1}"
      RESOLVE_TIMEOUT_MS: "${RESOLVE_TIMEOUT_MS:-45000}"
      # How long a search page may take to render its cards before the source
      # reports "no usable result links" (per-source overrides live in the
      # recipe's search.waitMs; overrides SEARCH_WAIT_MS when set).
      SEARCH_WAIT_MS: "${SEARCH_WAIT_MS:-12000}"
      # FlareSolverr listens on 8192 inside the container; on the NAS it is
      # published on 8193 by default (see FLARESOLVERR_HOST_PORT below).
      FLARESOLVERR_URL: "${FLARESOLVERR_URL:-http://flaresolverr:8192}"
      # How long the solver may take per page (30 s fits most challenges;
      # raise it on a slow NAS if searches log a solver timeout).
      FLARESOLVERR_TIMEOUT_MS: "${FLARESOLVERR_TIMEOUT_MS:-30000}"
      EXTERNAL_EXTRACTOR_URL: "${EXTERNAL_EXTRACTOR_URL:-}"
      # --- MovieBox bypass for SNI/IP-blocked ISPs ---
      # When api*.aoneroom.com is SNI-filtered the direct Node TLS handshake
      # (OpenSSL) is reset before ServerHello. Two built-in workarounds exist:
      #   1) set MOVIEBOX_PROXY to an http(s) or socks5 proxy that CAN reach
      #      the host (e.g. your router's VPN or http://proxy:3128), and
      #   2) keep MOVIEBOX_BROWSER_FALLBACK=true (default) so the app retries
      #      the same signed request via Chromium (BoringSSL, different JA3).
      # Both respect NO_PROXY (localhost by default). See docs/MOVIEBOX-TUI-COMPARISON.md §5.
      MOVIEBOX_PROXY: "${MOVIEBOX_PROXY:-}"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      ALL_PROXY: "${ALL_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,::1}"
      MOVIEBOX_EXTRA_HOSTS: "${MOVIEBOX_EXTRA_HOSTS:-}"
      MOVIEBOX_BROWSER_FALLBACK: "${MOVIEBOX_BROWSER_FALLBACK:-true}"
      # auto (default) = mobile BFF, fall back to the web (H5) BFF when the
      # api*.aoneroom.com edge never answers; h5 = web BFF first; mobile = never.
      MOVIEBOX_TRANSPORT: "${MOVIEBOX_TRANSPORT:-auto}"
      # --- UI password (recommended; VLC/Enigma2 stream URLs use tokens instead) ---
      APP_USERNAME: "${APP_USERNAME:-}"
      APP_PASSWORD: "${APP_PASSWORD:-}"
    devices:
      # This single line is what enables VAAPI transcoding on the DS918+.
      - /dev/dri:/dev/dri
    volumes:
      # Config, sessions and per-site cookies survive container upgrades.
      - ./data/config:/config
      - ./data/downloads:/downloads
      - ./data/tmp:/tmp/vumovie
    # Chromium needs more shared memory than Docker's 64 MB default.
    shm_size: 512m
    # Keep ffmpeg + chromium + node inside the NAS memory budget.
    mem_limit: "${MEM_LIMIT:-2500m}"
    depends_on:
      db:
        condition: service_healthy
      # FlareSolverr is an *optional* sidecar: the app must start even when the
      # solver's Chromium refuses to boot (that is a crash-loop, not a vu-movie
      # failure). Gating startup on `condition: service_healthy` here turned a
      # broken Cloudflare solver into "the whole app never comes up", so we only
      # ask Compose to start it and let the scraper degrade gracefully with a
      # "FlareSolverr is not reachable" log line.
      flaresolverr:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [vu-movie]

  # ------------------------------------------------------------------ postgres
  db:
    image: postgres:16-alpine
    container_name: vu-movie-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vu-movie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vumovie}
      POSTGRES_DB: ${POSTGRES_DB:-vumovie}
      # modest settings: this database stores a few hundred rows, not a data lake
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vu-movie} -d ${POSTGRES_DB:-vumovie}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
    networks: [vu-movie]

  # -------------------------------------------------------- Cloudflare solver
  # Always started with the project. FlareSolverr's listener stays on 8192
  # inside the container; it is published on host/NAS port 8193
  # (FLARESOLVERR_HOST_PORT) by default. Keep this port off public Internet.
  #
  # The scraper falls back to this container whenever a source returns a
  # Cloudflare / "Just a moment…" interstitial. When FlareSolverr is not
  # reachable the scraper logs a clear error instead of returning the
  # interstitial as an empty "0 results" response.
  flaresolverr:
    # Pin a tag (FLARESOLVERR_IMAGE=flaresolverr/flaresolverr:v3.3.21) if a new
    # `latest` ever breaks on your box — FlareSolverr has shipped releases whose
    # Chromium/undetected-chromedriver pairing did not start at all.
    image: ${FLARESOLVERR_IMAGE:-flaresolverr/flaresolverr:latest}
    container_name: vu-movie-flaresolverr
    restart: unless-stopped
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      PORT: "8192"
      TZ: "${TZ:-Europe/Amsterdam}"
    ports:
      - "${FLARESOLVERR_HOST_PORT:-8193}:8192"
    # Chromium needs more shared memory than Docker's 64 MB default. Without
    # this the browser hangs inside `test_browser_installation()` and
    # FlareSolverr dies with "Error getting browser User-Agent … Read timed
    # out" and restart-loops every ~7 minutes. (Same reason the app service
    # sets shm_size.)
    shm_size: "${FLARESOLVERR_SHM_SIZE:-512m}"
    # Chromium + Python + xvfb need roughly 1 GB; 800 MB was enough to make the
    # first browser launch exceed the 120 s chromedriver timeout on a J3455.
    mem_limit: "${FLARESOLVERR_MEM_LIMIT:-1200m}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8192/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      # Cold-starting Chromium on an Apollo Lake NAS can take a minute.
      start_period: 90s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [vu-movie]

volumes:
  pgdata:
    name: vu-movie-pgdata

networks:
  vu-movie:
    name: vu-movie
