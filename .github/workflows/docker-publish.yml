# Builds the vu-movie Docker image and publishes it to the GitHub Container
# Registry (ghcr.io), so the NAS can `docker compose pull` a ready-made image
# instead of compiling ffmpeg + Chromium on the DS918+.
#
# Manual setup in the GitHub UI:
#   1. Settings → Actions → General → Workflow permissions → "Read and write"
#   2. create this file at .github/workflows/docker-publish.yml (Add file → Create new file)
#   3. Actions → "Docker image" → Run workflow   (or just push to main)
#
# The image ends up at:  ghcr.io/<owner>/<repo>   →   ghcr.io/birdy1974/vu-movie
name: Docker image

on:
  # normal builds: every push to main, plus version tags (v1.0.0 → :1.0.0 and :1.0)
  push:
    branches: [main]
    tags: ['v*']
  # pull requests only build (no push) so a broken Dockerfile is caught before merge
  pull_request:
    branches: [main]
  # the "Run workflow" button in the Actions tab
  workflow_dispatch:
    inputs:
      push_image:
        description: Push the built image to ghcr.io
        type: boolean
        default: true

# GITHUB_TOKEN needs to be allowed to write packages (see step 1 above)
permissions:
  contents: read
  packages: write

# one build per branch/PR at a time; a newer push cancels the older run
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ gate
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test

  # ----------------------------------------------------------------- image
  build:
    name: Build & push (linux/amd64)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Registry image names must be lower case; GitHub owners can contain capitals.
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # The DS918+ is x86_64. Add linux/arm64 here if you also run an ARM
          # Synology (slower: the runner emulates ARM).
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push_image) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse layers between runs: the apt/Chromium/ffmpeg layers are ~350 MB.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attestation manifests confuse older Docker daemons (Synology's Container
          # Manager ships Docker 24) with "no matching manifest" errors — leave off.
          provenance: false
          sbom: false

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### 🐳 Image published"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "On the NAS: \`docker compose pull && docker compose up -d\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------- optional: Docker Hub
  # Uncomment to push the same image to Docker Hub as well. Needs two repository
  # secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an access token, not your
  # password: Docker Hub → Account settings → Security → New access token).
